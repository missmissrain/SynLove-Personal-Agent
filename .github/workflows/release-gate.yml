name: release-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  memory:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Memory and proactive gate
        run: python tools/RunMemoryGate.py
